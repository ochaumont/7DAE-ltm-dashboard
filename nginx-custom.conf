map $sent_http_content_type $expires_policy {
    default                    off;
    ~image/                    7d;
    ~font/                     30d;
    application/javascript     30d;
    text/css                   30d;
}

server {
    listen       $SERVER_PORT;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript
               text/xml application/xml text/javascript image/svg+xml font/ttf font/otf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    expires $expires_policy;

    # K8s liveness/readiness probe — matches both /health and /basepath/health
    location ~ /health$ {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # SPA routing — Next.js static export. The detail view is a single static
    # page (/labtestmean.html) that reads ?id= client-side, so no special rule
    # is needed for it.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Immutable cache for hashed JS/CSS/font/image assets
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No cache for HTML files
    location ~* \.html$ {
        add_header Cache-Control "private, no-cache, no-store, must-revalidate";
        add_header Expires "Sat, 01 Jan 2000 00:00:00 GMT";
        add_header Pragma no-cache;
    }
}
